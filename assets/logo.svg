<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景 -->
  <rect width="512" height="512" rx="48" fill="#0d1117"/>
  <!-- 钻石形陀螺 v3：下半短宽，整体更接近菱形 -->
  <polygon points="256,120 176,248 256,208" fill="#8b949e"/>
  <polygon points="256,120 336,248 256,208" fill="#6e7681"/>
  <polygon points="176,248 256,208 224,300" fill="#484f58"/>
  <polygon points="336,248 256,208 288,300" fill="#3d444d"/>
  <!-- 下半：短而宽（下尖 345） -->
  <polygon points="224,300 256,208 288,300 256,345" fill="#30363d"/>
  <polygon points="224,300 256,345 240,322" fill="#21262d"/>
  <polygon points="288,300 256,345 272,322" fill="#161b22"/>
  <!-- 折痕线 -->
  <line x1="256" y1="120" x2="256" y2="345" stroke="#f0f6fc" stroke-opacity="0.3" stroke-width="2.5"/>
  <line x1="176" y1="248" x2="336" y2="248" stroke="#f0f6fc" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="224" y1="300" x2="288" y2="300" stroke="#f0f6fc" stroke-opacity="0.2" stroke-width="1.5"/>
  <line x1="256" y1="208" x2="240" y2="322" stroke="#f0f6fc" stroke-opacity="0.15" stroke-width="1.5"/>
  <line x1="256" y1="208" x2="272" y2="322" stroke="#f0f6fc" stroke-opacity="0.15" stroke-width="1.5"/>
  <!-- 高光 -->
  <polygon points="256,120 300,220 256,208" fill="#f0f6fc" opacity="0.08"/>
  <!-- 底部悬浮阴影 -->
  <ellipse cx="256" cy="418" rx="78" ry="9" fill="#000" opacity="0.45"/>
  <!-- 梦境折叠轨迹虚线 -->
  <path d="M 56 372 Q 256 440 456 372" fill="none" stroke="#58a6ff" stroke-opacity="0.4" stroke-width="3.5" stroke-dasharray="12 9"/>
  <path d="M 84 394 Q 256 452 428 394" fill="none" stroke="#58a6ff" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="7 11"/>
  <!-- 文字 -->
  <text x="256" y="492" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#8b949e" letter-spacing="6">INCEPTION · DREAM</text>
</svg>
